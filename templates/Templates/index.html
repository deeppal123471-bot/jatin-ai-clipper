
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JATIN AI CLIPPER</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 20px;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}
.container {
    max-width: 600px;
    margin: 40px auto;
    padding: 25px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 18px;
}
h1 {
    text-align: center;
    color: #ff3030;
    font-size: 30px;
}
.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}
label {
    display: block;
    margin: 18px 0 8px;
}
input, select {
    width: 100%;
    padding: 14px;
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 15px;
}
button {
    width: 100%;
    padding: 15px;
    margin-top: 22px;
    background: #ff3030;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
.note {
    margin-top: 25px;
    color: #999;
    font-size: 13px;
    text-align: center;
}
.or {
    text-align: center;
    color: #ff3030;
    margin: 18px;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="container">

<h1>JATIN AI CLIPPER</h1>
<p class="subtitle">Turn Long Videos Into Shorts</p>

<form action="/generate" method="POST"
enctype="multipart/form-data" id="clipForm">

<label>YouTube Video Link</label>
<input type="url" name="video_url"
id="video_url" placeholder="Paste your video link here">

<div class="or">— OR —</div>

<label>Upload Your Video (MP4)</label>
<input type="file" name="video_file"
id="video_file" accept="video/mp4">

<label>Number of Clips</label>
<select name="clip_count">
<option value="1">1 Clip</option>
<option value="5">5 Clips</option>
<option value="10">10 Clips</option>
<option value="15">15 Clips</option>
<option value="20">20 Clips</option>
<option value="25">25 Clips</option>
<option value="30">30 Clips</option>
</select>

<label>Clip Duration</label>
<select name="duration">
<option value="60">About 1 Minute</option>
</select>

<label>Subtitles</label>
<select name="subtitles">
<option value="english">English Subtitles</option>
</select>

<button type="submit">GENERATE CLIPS</button>
</form>

<p class="note">
Use only videos you own or have permission to process.
</p>

</div>

<script>
document.getElementById("clipForm").addEventListener("submit", function(e) {
    const link = document.getElementById("video_url").value.trim();
    const file = document.getElementById("video_file").files.length;

    if (!link && !file) {
        e.preventDefault();
        alert("Please paste a YouTube link or upload an MP4 video.");
    }

    if (link && file) {
        e.preventDefault();
        alert("Please use either a YouTube link OR an uploaded video.");
    }
});
</script>

</body>
</html>
