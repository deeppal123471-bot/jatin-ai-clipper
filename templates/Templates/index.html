<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JATIN AI CLIPPER</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    padding: 25px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 18px;
}

h1 {
    text-align: center;
    color: #ff3030;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}

label {
    display: block;
    margin: 18px 0 8px;
}

input, select {
    width: 100%;
    padding: 14px;
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 22px;
    background: #ff3030;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
}

.note {
    margin-top: 25px;
    color: #999;
    font-size: 13px;
    text-align: center;
}
</style>
</head>

<body>
<div class="container">

<h1>JATIN AI CLIPPER</h1>

<p class="subtitle">
Turn Long Videos Into Shorts
</p>

<label>YouTube Video Link</label>
<input type="url" placeholder="Paste your video link here">

<label>Number of Clips</label>
<select>
<option>1 Clip</option>
<option>5 Clips</option>
<option>10 Clips</option>
<option>15 Clips</option>
<option>20 Clips</option>
<option>25 Clips</option>
<option>30 Clips</option>
</select>

<label>Clip Duration</label>
<select>
<option>About 1 Minute</option>
</select>

<label>Subtitles</label>
<select>
<option>English Subtitles</option>
</select>

<button type="button">GENERATE CLIPS</button>

<p class="note">
Access approval required. Only process videos you own
or have permission to use.
</p>

</div>
</body>
</html>
